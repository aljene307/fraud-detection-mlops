# Gate de qualite CI (Phase 4).
#
# Rend executoire le plancher de config/gate.yaml : un modele sous 0.80 de
# PR-AUC fait echouer la pipeline, et le job `image` du step 4.B ne demarrera
# donc pas.
#
# Deux jobs volontairement PARALLELES. Ce sont deux signaux independants :
# enchaines, un test rouge masquerait une regression du modele et il faudrait
# deux allers-retours pour decouvrir les deux problemes.
#
# Ce que la CI n'a PAS besoin de faire tourner : serveur MLflow, MinIO, base de
# donnees, bucket. `train.py --no-mlflow` ecrit un rapport JSON, et `gate.py` ne
# lit que ce JSON plus config/gate.yaml. La CI juge ; elle ne publie pas.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un seul run par branche : pousser trois fois de suite annule les deux premiers
# au lieu d'entrainer trois modeles pour rien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilege. Le GITHUB_TOKEN du run ne peut que LIRE le depot ; le droit
# d'ecrire des paquets sera ajoute au seul job qui en a besoin, en 4.B.
permissions:
  contents: read

env:
  # Meme version que docker/Dockerfile (python:3.13-slim-trixie) : la CI juge un
  # modele qui tournera sur cet interpreteur-la.
  PYTHON_VERSION: "3.13"

jobs:
  # ===========================================================================
  # Qualite du code -- SANS donnees
  # ===========================================================================
  # Aucun telechargement, aucun secret. Les 3 tests marques `requires_data`
  # portent un @pytest.mark.skipif(not RAW_CSV.exists()) evalue A LA COLLECTE :
  # ils se sautent d'eux-memes ici, et le compte affiche le prouve.
  quality:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Met en cache le repertoire de telechargement de pip, cle sur le
          # contenu de pyproject.toml. Les versions y sont figees en `==`, donc
          # la cle ne bouge qu'a un changement de dependance delibere.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dependances
        # Deux commandes, et l'ordre compte.
        #
        # 1. Le lock d'abord : c'est la cloture transitive EXACTE (123 paquets)
        #    que l'image Docker installe. La CI juge donc un modele entraine sur
        #    la meme pile que celle qui servira en production.
        # 2. Puis le groupe dev, absent du lock par construction
        #    (scripts/freeze_lock.py l'exclut deliberement). pip trouve tout deja
        #    satisfait aux versions verrouillees et n'ajoute que pytest, ruff et
        #    httpx2, plus l'installation editable qui rend `src` importable.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: pytest
        # Pas de -m "not requires_data" : on laisse le skipif operer, pour que la
        # sortie montre noir sur blanc "3 skipped" et non "3 deselected".
        run: pytest -q

  # ===========================================================================
  # Le gate de qualite du modele
  # ===========================================================================
  gate:
    name: Entrainement + gate PR-AUC
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # src/config.py n'importe que os et pathlib, donc cette lecture fonctionne
      # AVANT le pip install. On connait ainsi l'etat du cache avant de payer
      # l'installation.
      - name: Lire l'empreinte attendue du dataset
        id: dataset
        run: |
          echo "sha256=$(python -c 'from src.config import EXPECTED_SHA256; print(EXPECTED_SHA256)')" >> "$GITHUB_OUTPUT"

      # Le CONTENU est la cle. Changer EXPECTED_SHA256 dans config.py invalide ce
      # cache automatiquement -- il n'existe aucune facon de servir d'anciennes
      # donnees a une nouvelle empreinte.
      #
      # Volontairement SANS restore-keys : une restauration approchee rendrait un
      # dataset DIFFERENT, ce qui viderait le gate de son sens. Mieux vaut
      # retelecharger que comparer des choses differentes.
      - name: Cache du dataset
        id: cache-dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: dataset-${{ steps.dataset.outputs.sha256 }}

      # Seulement si le cache a manque : avec un cache chaud, la CI n'a aucun
      # besoin de Kaggle, et exiger les secrets la ferait echouer pour rien
      # (cas reel : une PR issue d'un fork, qui ne recoit jamais les secrets mais
      # peut lire le cache du depot).
      - name: Controler la presence des secrets Kaggle
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "::error title=Secrets Kaggle absents::Le cache du dataset est vide et KAGGLE_USERNAME / KAGGLE_KEY ne sont pas definis. Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secrets presents ; le dataset sera telecharge."

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e ".[dev]"

      # Lance INCONDITIONNELLEMENT, cache chaud ou froid. ensure_dataset ne
      # telecharge que si le fichier est absent, mais valide TOUJOURS : empreinte
      # SHA-256, 284 807 lignes, 492 fraudes, colonnes exactes. Un cache corrompu
      # est donc attrape ici, avant d'entrainer quoi que ce soit.
      - name: Telecharger et valider le dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python -m src.data.download

      # Ces 3 tests ne tournent JAMAIS ailleurs : ils se sautent partout ou le
      # CSV est absent. Ici les donnees existent, donc c'est le seul endroit de
      # la pipeline ou les constantes figees sont confrontees au vrai fichier.
      - name: Tests exigeant le vrai dataset
        run: pytest -m requires_data -q

      # Defauts volontairement non surcharges : --strategy=stratified et
      # --seed=42 sont exactement ce que config/gate.yaml a enregistre sous
      # baseline. Passer autre chose comparerait un modele a une reference qui
      # n'est pas la sienne.
      - name: Construire le split 60/20/20
        run: python -m src.features

      # --no-mlflow : aucun serveur a joindre, aucune version enregistree dans un
      # registre que personne n'a promue. L'entrainement ecrit
      # reports/training/xgb.json et c'est tout ce dont le gate a besoin.
      #
      # --model xgb seul : c'est le modele que gate.yaml juge. logreg et
      # xgb_smote etaient une question de recherche, tranchee en Phase 1.B et
      # archivee dans le bloc baseline ; les reentrainer a chaque push couterait
      # 21 s de plus pour un chiffre que personne ne lit.
      #
      # Le plancher a ete eprouve pour de vrai : en substituant logreg (0.7602)
      # a xgb, le job est devenu rouge au step du gate, plancher inchange a 0.80,
      # tandis que `quality` restait vert -- seul le modele etait mauvais, pas le
      # code. C'est la borne basse pour laquelle le plancher avait ete dimensionne.
      - name: Entrainer XGBoost
        run: python -m src.training.train --model xgb --no-mlflow

      # ------------------------------------------------------------------
      # LA LIGNE QUI BLOQUE
      # ------------------------------------------------------------------
      # gate.py se termine par `return 0 if result.passed else 1`. GitHub lit ce
      # code de retour : non nul, le job devient rouge et les steps suivants ne
      # tournent pas. Aucune analyse de logs, aucun grep, aucun parsing de sortie.
      #
      # Deliberement SANS tuyau. `... | tee -a "$GITHUB_STEP_SUMMARY"` serait
      # tentant, mais le shell par defaut d'Actions est `bash -e`, PAS
      # `bash -eo pipefail` : le code de retour d'un pipeline est celui de la
      # DERNIERE commande, donc tee renverrait 0 et le gate ne bloquerait plus
      # rien. Le resume est ecrit par le step suivant, separement.
      - name: Appliquer le gate de qualite
        run: python -m src.training.gate --report reports/training/xgb.json

      # if: always() -- ce resume a le plus de valeur quand le gate vient
      # d'echouer, or un step normal ne tournerait plus a ce stade.
      - name: Resumer le resultat dans le run
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, yaml

          report = pathlib.Path("reports/training/xgb.json")
          if not report.exists():
              print("### Gate PR-AUC\n\nAucun rapport : l'entrainement n'a pas abouti.")
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8"))
          gate = yaml.safe_load(pathlib.Path("config/gate.yaml").read_text(encoding="utf-8"))["gate"]
          floor = float(gate["min_pr_auc"])
          observed = float(data["test"]["pr_auc"])

          # frozen_threshold est None quand la precision cible est inatteignable
          # (cas reel : logreg plafonne a 87 % sur la validation). Formater None
          # en .8f leve un TypeError, et ce step tournant en if: always(), il
          # ajouterait un second X rouge pour une raison qui n'a rien a voir
          # avec le gate -- exactement ce qui brouille un diagnostic.
          def num(value, spec=".4f"):
              return "n/a" if value is None else format(float(value), spec)

          print("### Gate PR-AUC\n")
          print("| | |")
          print("|---|---|")
          print(f"| Verdict | {'PASSE' if observed >= floor else 'BLOQUE'} |")
          print(f"| modele | `{data['model_kind']}` |")
          print(f"| test_pr_auc observe | {observed:.4f} |")
          print(f"| plancher (config/gate.yaml) | {floor:.4f} |")
          print(f"| marge | {observed - floor:+.4f} |")
          print(f"| recall @ p90 | {num(data['test'].get('recall_at_p90'))} |")
          print(f"| seuil fige | {num(data.get('frozen_threshold'), '.8f')} |")
          print(f"| duree d'ajustement | {num(data.get('fit_seconds'), '.2f')} s |")

          for warning in data.get("warnings") or []:
              print(f"\n> [!WARNING]\n> {warning}")
          PY

      # Permet de lire le chiffre exact d'un run rouge sans le rejouer.
      - name: Publier le rapport d'entrainement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-entrainement
          path: reports/training/xgb.json
          if-no-files-found: warn

  # ===========================================================================
  # L'image : construite partout, eprouvee partout, publiee seulement sur main
  # ===========================================================================
  # `needs` ne fait pas qu'ordonner, il CONDITIONNE : sa semantique par defaut
  # est "tous les jobs listes doivent avoir reussi". C'est la seule ligne qui
  # relie la qualite du modele a la livraison. Gate rouge => ce job n'est pas
  # rouge, il est SKIPPED : il n'a jamais demarre. Le X reste ainsi sur le job
  # qui a diagnostique le probleme, et non duplique sur celui qui en subit la
  # consequence.
  #
  # ATTENTION : un `if: always()` (ou !cancelled(), ou failure()) au niveau de ce
  # job ANNULERAIT ce conditionnement et le ferait tourner malgre un gate rouge.
  # C'est pourquoi la distinction PR / main se fait sur les STEPS et jamais ici.
  image:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, gate]

    # Ces permissions ECRASENT le bloc `contents: read` du workflow, pour ce job
    # seulement. `quality` et `gate` restent incapables d'ecrire quoi que ce
    # soit, meme si un paquet compromis y executait du code.
    permissions:
      contents: read
      packages: write

    env:
      # github.repository vaut "aljene307/fraud-detection-mlops", deja en
      # minuscules. GHCR REFUSE les majuscules dans un nom d'image : un compte
      # avec une capitale casserait ici, et il faudrait abaisser la casse.
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      # buildx est le constructeur etendu de Docker (BuildKit). Il est requis ici
      # pour une raison precise : lui seul sait lire et ecrire un cache de
      # couches dans un magasin EXTERNE. Chaque run etant une VM neuve, le cache
      # local de Docker est toujours vide -- sans cache externe, chaque
      # construction reinstallerait les 123 paquets du lock depuis zero.
      - uses: docker/setup-buildx-action@v3

      # push: false, load: true -- on construit et on charge dans le demon local
      # SANS publier, y compris sur main. L'ordre est delibere : on n'expose
      # jamais une image qui n'a pas demarre. La publication vient apres le
      # smoke test.
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # mode=max met aussi en cache les couches intermediaires, pas seulement
          # celles de l'image finale : c'est ce qui evite de refaire le pip
          # install quand seul src/ a change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # Le smoke test : "ca construit" est faible, "ca demarre et repond" non
      # ------------------------------------------------------------------
      # Le conteneur demarre forcement DEGRADE : la CI n'a ni serveur MLflow ni
      # registre, donc aucun modele sous @production. C'est precisement ce qu'on
      # veut eprouver. /health doit repondre 200 quand meme -- c'est la
      # conception du step 2.B, et sans elle une sonde de liveness tuerait le pod
      # en boucle sous Kubernetes pour un probleme recuperable.
      #
      # On interroge depuis le RUNNER via le port publie, pas depuis l'interieur :
      # l'image slim n'embarque pas curl (d'ou le HEALTHCHECK en python).
      - name: Verifier que l'image demarre et repond
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e FRAUD_MODEL_WAIT_SECONDS=1 \
            "$IMAGE:${{ github.sha }}"

          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            if [ "$code" = "200" ]; then
              echo "/health a repondu 200 apres ${i}s"
              echo "  corps : $(curl -s http://localhost:8000/health)"

              # /ready doit dire 503 : le processus vit mais ne peut pas scorer.
              # Observation et non assertion bloquante -- l'assertion dure porte
              # sur /health, qui est la garantie demandee.
              ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ready || true)
              echo "  /ready = $ready (503 attendu : aucun modele sous @production)"
              if [ "$ready" != "503" ]; then
                echo "::warning title=/ready inattendu::code $ready, 503 attendu sans registre"
              fi
              exit 0
            fi
            sleep 1
          done

          echo "::error title=L'image ne repond pas::/health n'a pas renvoye 200 en 45 s (dernier code : ${code:-aucun}). Si le conteneur est sorti, la cause est dans les logs ci-dessous."
          docker logs smoke || true
          exit 1

      - name: Nettoyer le conteneur de test
        if: always()
        run: docker rm -f smoke || true

      # Connexion seulement au moment de publier : rien avant n'a besoin du
      # registre, l'image de base python:3.13-slim-trixie etant publique.
      #
      # Aucun secret a creer. Le GITHUB_TOKEN est fabrique par GitHub POUR CE RUN,
      # limite a ce depot, et expire des que le run se termine. C'est aussi lui
      # qui fait que GHCR rattache automatiquement le paquet au depot.
      - name: Se connecter a GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L'image est deja construite et taguee localement : on pousse, on ne
      # reconstruit pas.
      #
      # Deux tags, et le second est celui qui compte. `latest` est MUTABLE : il
      # designera demain autre chose qu'aujourd'hui. Le tag par SHA de commit est
      # le seul moyen de dire "exactement cette construction-la", donc la base
      # d'un retour arriere credible.
      - name: Publier sur GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          {
            echo "### Image publiee"
            echo
            echo '```'
            echo "docker pull $IMAGE:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
